models:
  - name: int_streams
    columns:
      - name: stream_id
        data_tests:
          - unique
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: title_id
        data_tests:
          - not_null
      - name: started_at
        data_tests:
          - not_null
      - name: seconds_watched
        data_tests:
          - not_null
      - name: is_bot
        data_tests:
          - not_null
          - accepted_values:
              severity: warn
              values: [false] 
              config:
                store_failures: true 
      - name: has_nearby_dup
        data_tests:
          - not_null